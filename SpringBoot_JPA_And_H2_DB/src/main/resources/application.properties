# Enable the in-memory H2 database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sankalp
spring.datasource.password=

# Automatically create and update database tables from entity classes
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in the Eclipse console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console to inspect tables in your browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console