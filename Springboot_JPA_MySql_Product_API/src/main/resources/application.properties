# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# 'update' automatically updates the schema to match your entity classes on startup.
# Automatically create and update database tables from entity classes.
spring.jpa.hibernate.ddl-auto=update


# Show generated SQL in the Eclipse console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

#Tell Jackson to apply UPPER_CAMEL_CASE (PascalCase) across all JSON and XML models globally without having to edit every Java field.
#spring.jackson.property-naming-strategy=UPPER_CAMEL_CASE



spring.mvc.log-resolved-exception=false

# ===============================
# LOGGING CONFIGURATION
# ===============================
# Root logging level (default for third-party libraries: Spring, Tomcat, etc.)
logging.level.root=INFO
# Set your own application package to DEBUG to see granular logs
logging.level.com.example.springBoot=DEBUG
# Show clean SQL statements, but keep Hibernate internals concise
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Save logs to a file in a 'logs' directory in your project root
logging.file.name=logs/application.log
# Log rotation: Maximum file size before archiving old logs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# ===============================
# LOGGING PATTERNS WITH LINE NUMBERS
# ===============================
# Pattern for application.log: includes date, level, PID, thread, ClassName:LineNumber, message
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level ${PID:- } --- [%15.15t] %C{1.}:%L : %m%n
# Optional: Apply the same pattern to the Eclipse Console
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%C{1.}:%L){cyan} %clr(:){faint} %m%n

# No hibernate.dialect needed: Hibernate 6 detects it from the connection.
#You'd only set it explicitly if autodetection picked the wrong one. 
#For example, a MariaDB server behind a MySQL driver, or an old database version that needs specific SQL. For a 
#normal local MySQL you don't have that problem.
