# Enable the in-memory H2 database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sankalp
spring.datasource.password=

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop


# Show generated SQL in the Eclipse console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Show clean SQL statements, but keep Hibernate internals concise
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# Save logs to a file in a 'logs' directory in your project root
logging.file.name=logs/testApplication.log



# Enable H2 Web Console to inspect tables in your browser
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
